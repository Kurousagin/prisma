<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Prisma · Controle</title>
<style>
  :root{--surf:rgba(255,255,255,.08);--ac:#9B7CFF;--tx:#F3EEFF;--dim:#B9ADDA;--line:rgba(255,255,255,.16)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
  html,body{margin:0;height:100%}
  body{background:linear-gradient(160deg,#2A1B6B,#1C2A5A 60%,#120A28);color:var(--tx);
       font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
       display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 12px 22px}
  .top{display:flex;align-items:center;gap:10px;width:100%;max-width:540px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--ac)}
  .brand{font-size:12px;letter-spacing:.14em;color:var(--dim);font-weight:700}
  .flash{margin-left:auto;font-size:11px;color:#FF7AB6;opacity:0;transition:opacity .2s}
  .consoles{display:flex;gap:7px;width:100%;max-width:540px;overflow-x:auto;padding-bottom:2px}
  .consoles::-webkit-scrollbar{height:0}
  .cchip{flex:0 0 auto;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surf);
         color:var(--dim);font-size:13px;font-weight:700;cursor:pointer}
  .cchip.on{background:var(--ac);color:#1A1433;border-color:transparent}

  /* ===== casco do controle (tematizado por console) ===== */
  .shell{width:100%;max-width:540px;flex:1;display:flex;flex-direction:column;gap:14px;justify-content:center;
         padding:20px 16px;border-radius:26px;box-shadow:0 16px 44px -18px #000, inset 0 2px 0 rgba(255,255,255,.07);
         background:linear-gradient(180deg,#2a2740,#1a1830)}
  .gbtn{border:1px solid var(--line);color:var(--tx);background:rgba(255,255,255,.1);border-radius:16px;font-weight:800;
        cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:none;transition:transform .05s}
  .gbtn.on{filter:brightness(1.35);transform:scale(.93)}
  .shoulders{display:flex;gap:12px}
  .shoulders:empty{display:none}
  .shoulders .gbtn{flex:1;padding:14px 0;font-size:15px;border-radius:12px 12px 4px 4px}
  .main{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .dpad{display:grid;grid-template:repeat(3,52px)/repeat(3,52px);gap:5px}
  .dpad .gbtn{font-size:20px;background:#2a2a30;color:#f3eeff;border-color:rgba(0,0,0,.4)}
  .gu{grid-area:1/2;border-radius:10px 10px 2px 2px}.gl{grid-area:2/1;border-radius:10px 2px 2px 10px}
  .gr{grid-area:2/3;border-radius:2px 10px 10px 2px}.gd{grid-area:3/2;border-radius:2px 2px 10px 10px}
  .dpad .mid{grid-area:2/2;background:#2a2a30}
  .face{display:flex;gap:12px;align-items:center;justify-content:flex-end}
  .face .rbtn{width:62px;height:62px;border-radius:50%;font-size:20px}
  .face.diamond{display:grid;grid-template:repeat(3,52px)/repeat(3,52px);gap:6px}
  .face.diamond .gbtn{width:52px;height:52px;border-radius:50%;font-size:19px}
  .face.diamond .fx{grid-area:1/2}.face.diamond .fy{grid-area:2/1}.face.diamond .fa{grid-area:2/3}.face.diamond .fb{grid-area:3/2}
  .startsel{display:flex;gap:16px;justify-content:center}
  .startsel .gbtn{padding:10px 20px;font-size:12px;border-radius:999px;background:#2a2a30}
  .hint{font-size:11px;color:var(--dim);text-align:center}

  /* --- NES: cinza, cruz preta, A/B vermelhos, start/select pretos retangulares --- */
  .shell.nes{background:linear-gradient(180deg,#dcd9d0,#bdbab0);border-radius:12px}
  .shell.nes .rbtn{background:#c23b2e;border-color:#7d241b;color:#fff}
  .shell.nes .startsel .gbtn{background:#2a2a30;color:#eee;border-radius:7px;padding:8px 18px}
  /* --- SNES: cinza arredondado, losango colorido (cores do Super Famicom) --- */
  .shell.snes{background:linear-gradient(180deg,#d2cec5,#b2aea3);border-radius:46px}
  .shell.snes .fx{background:#2f6ae0;color:#fff;border-color:transparent}
  .shell.snes .fy{background:#36b06a;color:#fff;border-color:transparent}
  .shell.snes .fa{background:#e0485a;color:#fff;border-color:transparent}
  .shell.snes .fb{background:#e8b84a;color:#3a2a00;border-color:transparent}
  .shell.snes .startsel .gbtn{background:#6b5bbf;color:#fff}
  .shell.snes .shoulders .gbtn{background:#cfcbc2;color:#2a2433;border-color:rgba(0,0,0,.2)}
  /* --- Mega Drive: preto arredondado, A/B/C escuros em arco --- */
  .shell.md{background:linear-gradient(180deg,#2a2a30,#121216);border-radius:52px}
  .shell.md .rbtn{background:#33333c;color:#fff;border:1px solid rgba(255,255,255,.18)}
  .shell.md .face{padding:18px 0}
  .shell.md .face .rbtn:nth-child(1){transform:translateY(14px)}
  .shell.md .face .rbtn:nth-child(3){transform:translateY(-14px)}
  .shell.md .startsel .gbtn{background:#33333c;color:#fff}
  /* --- Game Boy: cinza-oliva, A/B vinho na diagonal --- */
  .shell.gb{background:linear-gradient(180deg,#bcbeb3,#9a9c90);border-radius:16px 16px 16px 40px}
  .shell.gb .rbtn{background:#8e2b4a;color:#fff;border-color:#5a1830}
  .shell.gb .face .rbtn:nth-child(1){transform:translateY(16px)}
  .shell.gb .face .rbtn:nth-child(2){transform:translateY(-16px)}
  .shell.gb .startsel .gbtn{background:#6f7266;color:#fff;transform:rotate(-24deg)}
  /* --- GBA: roxo, botões escuros, L/R no topo --- */
  .shell.gba{background:linear-gradient(180deg,#5546c4,#3a2f93);border-radius:46px}
  .shell.gba .rbtn{background:#241d4a;color:#fff;border-color:transparent}
  .shell.gba .startsel .gbtn{background:#241d4a;color:#fff}
  .shell.gba .shoulders .gbtn{background:#4a3cae;color:#fff;border-color:transparent}
  .shell.gba .dpad .gbtn{background:#241d4a}

  @media (orientation:landscape){
    body{padding:6px 16px;gap:8px;overflow:hidden}
    .brand,.hint{display:none}
    .shell{max-width:none;padding:12px 20px}
    .main{padding:0 2vw}
    .dpad{grid-template:repeat(3,min(15vh,80px))/repeat(3,min(15vh,80px))}
    .face.diamond{grid-template:repeat(3,min(15vh,80px))/repeat(3,min(15vh,80px))}
    .face .rbtn{width:min(16vh,76px);height:min(16vh,76px)}
  }
</style>
</head>
<body>
  <div class="top"><span class="dot"></span><span class="brand">PRISMA · CONTROLE</span><span class="flash" id="flash">sem conexão</span></div>
  <div class="consoles" id="consoles"></div>

  <div class="shell" id="shell">
    <div class="shoulders" id="shoulders"></div>
    <div class="main">
      <div class="dpad">
        <button class="gbtn gu" data-g="UP">▲</button>
        <button class="gbtn gl" data-g="LEFT">◀</button>
        <div class="mid"></div>
        <button class="gbtn gr" data-g="RIGHT">▶</button>
        <button class="gbtn gd" data-g="DOWN">▼</button>
      </div>
      <div class="face" id="face"></div>
    </div>
    <div class="startsel" id="startsel"></div>
  </div>
  <div class="hint">segure os botões · gire o celular pra deitar</div>

<script>
  var flash = document.getElementById('flash');
  function warn(){ flash.style.opacity=1; setTimeout(function(){flash.style.opacity=0;},1500); }
  function g(code,act){ fetch('/game?k='+code+'&a='+act,{method:'POST'}).catch(warn); }

  function bind(el){
    if(el._b) return; el._b=1;
    var code=el.getAttribute('data-g'), held=false;
    function d(e){ e.preventDefault(); if(held)return; held=true; el.classList.add('on'); if(navigator.vibrate)navigator.vibrate(6); g(code,'down'); }
    function u(e){ e.preventDefault(); if(!held)return; held=false; el.classList.remove('on'); g(code,'up'); }
    el.addEventListener('pointerdown',d); el.addEventListener('pointerup',u);
    el.addEventListener('pointercancel',u); el.addEventListener('pointerleave',u);
  }
  function bindAll(){ document.querySelectorAll('[data-g]').forEach(bind); }

  var CLS={'NES':'nes','Super Nintendo':'snes','Game Boy':'gb','Game Boy Advance':'gba','Mega Drive':'md'};
  // face = [rótulo, código enviado]; lr = ombros; sel = rótulo do Select
  var LAYOUTS = {
    'NES':              {face:[['B','B'],['A','A']], lr:false, sel:'SELECT'},
    'Game Boy':         {face:[['B','B'],['A','A']], lr:false, sel:'SELECT'},
    'Game Boy Advance': {face:[['B','B'],['A','A']], lr:true,  sel:'SELECT'},
    'Super Nintendo':   {face:'diamond',             lr:true,  sel:'SELECT'},
    // Mega Drive: A/B/C -> Y/B/A (genesis_plus_gx); Mode = Select
    'Mega Drive':       {face:[['A','Y'],['B','B'],['C','A']], lr:false, sel:'MODE'}
  };
  var shell=document.getElementById('shell'), faceEl=document.getElementById('face'),
      shEl=document.getElementById('shoulders'), ssEl=document.getElementById('startsel');

  function render(sys){
    var L = LAYOUTS[sys] || LAYOUTS['Super Nintendo'];
    shell.className = 'shell ' + (CLS[sys] || 'snes');
    if(L.face==='diamond'){
      faceEl.className='face diamond';
      faceEl.innerHTML='<button class="gbtn fx" data-g="X">X</button><button class="gbtn fy" data-g="Y">Y</button>'+
        '<button class="gbtn fa" data-g="A">A</button><button class="gbtn fb" data-g="B">B</button>';
    } else {
      faceEl.className='face';
      faceEl.innerHTML=L.face.map(function(b){ return '<button class="gbtn rbtn" data-g="'+b[1]+'">'+b[0]+'</button>'; }).join('');
    }
    shEl.innerHTML = L.lr ? '<button class="gbtn" data-g="L">L</button><button class="gbtn" data-g="R">R</button>' : '';
    ssEl.innerHTML = '<button class="gbtn" data-g="SELECT">'+L.sel+'</button><button class="gbtn" data-g="START">Start</button>';
    bindAll();
    document.querySelectorAll('.cchip').forEach(function(c){ c.classList.toggle('on', c.dataset.sys===sys); });
  }

  var SYS=['NES','Super Nintendo','Game Boy','Game Boy Advance','Mega Drive'];
  var SHORT={'NES':'NES','Super Nintendo':'SNES','Game Boy':'GB','Game Boy Advance':'GBA','Mega Drive':'Mega Drive'};
  var cEl=document.getElementById('consoles'), manual=false;
  SYS.forEach(function(s){
    var b=document.createElement('button'); b.className='cchip'; b.dataset.sys=s; b.textContent=SHORT[s];
    b.onclick=function(){ manual=true; render(s); }; cEl.appendChild(b);
  });

  render('Super Nintendo');

  function sync(){
    if(manual) return;
    fetch('/system').then(function(r){return r.text();}).then(function(t){
      t=(t||'').trim(); if(t && LAYOUTS[t]) render(t);
    }).catch(function(){});
  }
  sync(); setInterval(sync,2500);

  document.addEventListener('dblclick',function(e){e.preventDefault();},{passive:false});
  document.addEventListener('gesturestart',function(e){e.preventDefault();},{passive:false});
</script>
</body>
</html>
