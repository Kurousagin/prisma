<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Prisma · Controle</title>
<style>
  :root{--surf:rgba(255,255,255,.08);--ac:#9B7CFF;--tx:#F3EEFF;--dim:#B9ADDA;--line:rgba(255,255,255,.16)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
  html,body{margin:0;height:100%}
  body{background:linear-gradient(160deg,#2A1B6B,#1C2A5A 60%,#120A28);color:var(--tx);
       font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
       display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 14px 26px}
  .top{display:flex;align-items:center;gap:10px;width:100%;max-width:460px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--ac)}
  .brand{font-size:12px;letter-spacing:.14em;color:var(--dim);font-weight:700}
  .flash{margin-left:auto;font-size:11px;color:#FF7AB6;opacity:0;transition:opacity .2s}
  .consoles{display:flex;gap:7px;width:100%;max-width:460px;overflow-x:auto;padding-bottom:2px}
  .consoles::-webkit-scrollbar{height:0}
  .cchip{flex:0 0 auto;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surf);
         color:var(--dim);font-size:13px;font-weight:700;cursor:pointer}
  .cchip.on{background:var(--ac);color:#1A1433;border-color:transparent}
  .gamepad{width:100%;max-width:460px;display:flex;flex-direction:column;gap:16px;flex:1;justify-content:center}
  .gbtn{background:var(--surf);border:1px solid var(--line);color:var(--tx);border-radius:16px;font-weight:700;
        cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:none}
  .gbtn.on{background:var(--ac);color:#1A1433;border-color:transparent;transform:scale(.95)}
  .shoulders{display:flex;gap:12px}
  .shoulders:empty{display:none}
  .shoulders .gbtn{flex:1;padding:16px 0;font-size:16px}
  .main{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .dpad{display:grid;grid-template:repeat(3,54px)/repeat(3,54px);gap:6px}
  .dpad .gbtn{font-size:22px}
  .gu{grid-area:1/2}.gl{grid-area:2/1}.gr{grid-area:2/3}.gd{grid-area:3/2}
  .face{display:flex;gap:10px;align-items:center;justify-content:flex-end}
  .face .rbtn{width:62px;height:62px;border-radius:50%;font-size:20px}
  .face.diamond{display:grid;grid-template:repeat(3,54px)/repeat(3,54px);gap:6px}
  .face.diamond .gbtn{width:54px;height:54px;border-radius:50%;font-size:20px}
  .face.diamond .fx{grid-area:1/2}.face.diamond .fy{grid-area:2/1}.face.diamond .fa{grid-area:2/3}.face.diamond .fb{grid-area:3/2}
  .startsel{display:flex;gap:14px;justify-content:center}
  .startsel .gbtn{padding:12px 22px;font-size:13px;border-radius:999px}
  .hint{font-size:11px;color:var(--dim);text-align:center}
  @media (orientation:landscape){
    body{padding:6px 16px;gap:8px;overflow:hidden}
    .brand,.hint{display:none}
    .gamepad{max-width:none}
    .main{padding:0 2vw}
    .dpad{grid-template:repeat(3,min(16vh,88px))/repeat(3,min(16vh,88px))}
    .face.diamond{grid-template:repeat(3,min(16vh,88px))/repeat(3,min(16vh,88px))}
    .face .rbtn{width:min(17vh,82px);height:min(17vh,82px)}
  }
</style>
</head>
<body>
  <div class="top"><span class="dot"></span><span class="brand">PRISMA · CONTROLE</span><span class="flash" id="flash">sem conexão</span></div>
  <div class="consoles" id="consoles"></div>
  <div class="gamepad">
    <div class="shoulders" id="shoulders"></div>
    <div class="main">
      <div class="dpad">
        <button class="gbtn gu" data-g="UP">▲</button>
        <button class="gbtn gl" data-g="LEFT">◀</button>
        <button class="gbtn gr" data-g="RIGHT">▶</button>
        <button class="gbtn gd" data-g="DOWN">▼</button>
      </div>
      <div class="face" id="face"></div>
    </div>
    <div class="startsel" id="startsel"></div>
  </div>
  <div class="hint">segure os botões · gire o celular pra deitar</div>

<script>
  var flash = document.getElementById('flash');
  function warn(){ flash.style.opacity=1; setTimeout(function(){flash.style.opacity=0;},1500); }
  function g(code,act){ fetch('/game?k='+code+'&a='+act,{method:'POST'}).catch(warn); }

  function bind(el){
    if(el._b) return; el._b=1;
    var code=el.getAttribute('data-g'), held=false;
    function d(e){ e.preventDefault(); if(held)return; held=true; el.classList.add('on'); if(navigator.vibrate)navigator.vibrate(6); g(code,'down'); }
    function u(e){ e.preventDefault(); if(!held)return; held=false; el.classList.remove('on'); g(code,'up'); }
    el.addEventListener('pointerdown',d); el.addEventListener('pointerup',u);
    el.addEventListener('pointercancel',u); el.addEventListener('pointerleave',u);
  }
  function bindAll(){ document.querySelectorAll('[data-g]').forEach(bind); }

  // layout por console: face = [rótulo, código enviado], ombros L/R, rótulo do Select
  var LAYOUTS = {
    'NES':              {face:[['B','B'],['A','A']], lr:false, sel:'SELECT'},
    'Game Boy':         {face:[['B','B'],['A','A']], lr:false, sel:'SELECT'},
    'Game Boy Advance': {face:[['B','B'],['A','A']], lr:true,  sel:'SELECT'},
    'Super Nintendo':   {face:'diamond',             lr:true,  sel:'SELECT'},
    // Mega Drive: A/B/C mapeiam p/ Y/B/A (genesis_plus_gx); Mode = Select
    'Mega Drive':       {face:[['A','Y'],['B','B'],['C','A']], lr:false, sel:'MODE'}
  };
  var faceEl=document.getElementById('face'), shEl=document.getElementById('shoulders'), ssEl=document.getElementById('startsel');

  function render(sys){
    var L = LAYOUTS[sys] || LAYOUTS['Super Nintendo'];
    if(L.face==='diamond'){
      faceEl.className='face diamond';
      faceEl.innerHTML='<button class="gbtn fx" data-g="X">X</button><button class="gbtn fy" data-g="Y">Y</button>'+
        '<button class="gbtn fa" data-g="A">A</button><button class="gbtn fb" data-g="B">B</button>';
    } else {
      faceEl.className='face';
      faceEl.innerHTML=L.face.map(function(b){ return '<button class="gbtn rbtn" data-g="'+b[1]+'">'+b[0]+'</button>'; }).join('');
    }
    shEl.innerHTML = L.lr ? '<button class="gbtn" data-g="L">L</button><button class="gbtn" data-g="R">R</button>' : '';
    ssEl.innerHTML = '<button class="gbtn" data-g="SELECT">'+L.sel+'</button><button class="gbtn" data-g="START">Start</button>';
    bindAll();
    document.querySelectorAll('.cchip').forEach(function(c){ c.classList.toggle('on', c.dataset.sys===sys); });
  }

  // chips de console (seletor manual)
  var SYS=['NES','Super Nintendo','Game Boy','Game Boy Advance','Mega Drive'];
  var SHORT={'NES':'NES','Super Nintendo':'SNES','Game Boy':'GB','Game Boy Advance':'GBA','Mega Drive':'Mega Drive'};
  var cEl=document.getElementById('consoles'), manual=false;
  SYS.forEach(function(s){
    var b=document.createElement('button'); b.className='cchip'; b.dataset.sys=s; b.textContent=SHORT[s];
    b.onclick=function(){ manual=true; render(s); }; cEl.appendChild(b);
  });

  render('Super Nintendo');   // padrão até saber o jogo aberto

  // segue o console do jogo aberto (até você escolher um manualmente)
  function sync(){
    if(manual) return;
    fetch('/system').then(function(r){return r.text();}).then(function(t){
      t=(t||'').trim(); if(t && LAYOUTS[t]) render(t);
    }).catch(function(){});
  }
  sync(); setInterval(sync,2500);

  document.addEventListener('dblclick',function(e){e.preventDefault();},{passive:false});
  document.addEventListener('gesturestart',function(e){e.preventDefault();},{passive:false});
</script>
</body>
</html>
